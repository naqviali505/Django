{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static 'blog/main.css' %}">
    <title>{{blog.title}}</title>
</head>
<body>
{% include "blog/navbar.html" %}

<div class="container mt-5">
    <h1 class="mb-4 text-center">{{blog.title}}</h1>
    <form>
        {% csrf_token %}
        <div class="mb-3">
            <textarea class="form-control" rows="10" readonly>{{blog.content}} {% for category in blog.categories.all %}#{{ category.name }} {% endfor %}
            </textarea>
        </div>
        <p>Written by <b>{{blog.user}}</b> on {{blog.created_at}}</p>
        <div class="mb-3">
            <h2>Comments</h2>
            {% for comment in blog.comments.all %}
            <label class="form-label">
      <strong>{{ comment.user.username }}</strong>:
    </label>
            <textarea class="form-control" rows="3" readonly>{{ comment.content }}
                </textarea><br>
            {% endfor %}
        </div>
    </form>
</div>


</body>
</html>
